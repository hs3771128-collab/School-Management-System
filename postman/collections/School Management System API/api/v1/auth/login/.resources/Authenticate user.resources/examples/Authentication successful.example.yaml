$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "password": "ExamplePassword123!",
        "username": "superadmin"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "accessToken": "string",
        "tokenType": "string",
        "expiresInSeconds": 5264,
        "username": "string",
        "role": "TEACHER",
        "expiresAt": "1985-06-12T00:26:55.210Z"
      }
order: 1000
