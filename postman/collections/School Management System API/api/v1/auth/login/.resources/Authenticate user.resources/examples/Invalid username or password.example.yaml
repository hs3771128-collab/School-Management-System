$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "password": "ExamplePassword123!",
        "username": "superadmin"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "timestamp": "1986-03-07T05:25:26.830Z",
        "status": 9020,
        "error": "string",
        "message": "string",
        "path": "string",
        "details": ""
      }
order: 3000
