$kind: http-request
description: Changes the authenticated user's password after validating the current password.
url: "{{baseUrl}}/api/v1/auth/change-password"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "currentPassword": "stringstring",
      "newPassword": "stringstring"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Change current user's password.resources/examples
order: 1000
