$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/accounts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "password": "stringstring",
        "role": "TEACHER",
        "username": "OnOn",
        "adminId": 525,
        "superAdminId": 985,
        "teacherId": 7527,
        "studentId": 8389,
        "parentGuardianId": 3211
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "timestamp": "1986-03-07T05:25:26.830Z",
        "status": 9020,
        "error": "string",
        "message": "string",
        "path": "string",
        "details": ""
      }
order: 6000
