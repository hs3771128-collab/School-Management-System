$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/me"
  method: GET
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "id": 1542,
        "username": "string",
        "role": "PARENT_GUARDIAN",
        "status": "ACTIVE"
      }
order: 1000
