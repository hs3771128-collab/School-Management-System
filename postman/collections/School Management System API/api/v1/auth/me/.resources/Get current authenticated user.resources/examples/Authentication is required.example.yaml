$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/me"
  method: GET
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "timestamp": "1986-03-07T05:25:26.830Z",
        "status": 9020,
        "error": "string",
        "message": "string",
        "path": "string",
        "details": ""
      }
order: 2000
