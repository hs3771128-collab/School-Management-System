$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/bootstrap"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "firstName": "System",
        "lastName": "Administrator",
        "password": "StrongPassword123!",
        "status": "ACTIVE",
        "username": "superadmin",
        "dateOfBirth": "1990-01-01",
        "gender": "MALE",
        "email": "superadmin@school.com",
        "phone": "03001234567",
        "address": "School Management System"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "id": 1542,
        "username": "string",
        "role": "PARENT_GUARDIAN",
        "status": "ACTIVE"
      }
order: 1000
