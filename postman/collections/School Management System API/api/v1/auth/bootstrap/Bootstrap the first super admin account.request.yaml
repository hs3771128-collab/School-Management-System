$kind: http-request
description: Creates the first SUPER_ADMIN authentication account when authentication bootstrap is enabled and no authentication account exists.
url: "{{baseUrl}}/api/v1/auth/bootstrap"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "firstName": "System",
      "lastName": "Administrator",
      "password": "StrongPassword123!",
      "status": "ACTIVE",
      "username": "superadmin",
      "dateOfBirth": "1990-01-01",
      "gender": "MALE",
      "email": "superadmin@school.com",
      "phone": "03001234567",
      "address": "School Management System"
    }
settings: {}
examples: ./.resources/Bootstrap the first super admin account.resources/examples
order: 1000
