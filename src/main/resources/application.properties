spring.application.name=school-management-system

server.port=8080

# MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/school_management
spring.datasource.username=enroll
spring.datasource.password=enroll123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
app.security.jwt.secret=SchoolManagementSystemLocalJwtSecretKey2026Secure
app.security.jwt.expiration-seconds=3600

# ==============================
# Security bootstrap
# ==============================
app.security.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
